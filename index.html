    --hover: #F3F4F6;
    --border: #E9ECEF;
    --pos-bg: #FFFFFF;
    --pos-bg-hover: #F3F4F6;
    --pos-bg-subtle: #F8F9FA;
    --pos-border: #E9ECEF;
    --pos-border-light: #F0F1F3;
    --pos-text: #111827;
    --pos-text-secondary: #4B5563;
    --pos-text-muted: #9CA3AF;
    --pos-accent: #2563EB;
    --pos-success: #059669;
    --pos-danger: #DC2626;
    --pos-btn-h: 44px;
    --pos-total-font: 24px;
    --pos-td-font: 14px;
    --pos-th-font: 11px;
    --pos-radius: 10px;
    --pos-radius-sm: 6px;
  }

  /* ── Bulk bar → скрыт, логика в нижней панели ── */
  .pos-redesign .pos-bulk-bar { display: none !important; }

  /* ── Bottom bar ── */
  .pos-redesign .pos-bottom-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--pos-bg);
    border-top: 1px solid var(--pos-border);
    flex-shrink: 0;
  }
  .pos-redesign .pos-bottom-left {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .pos-redesign .pos-total-label {
    font-size: 11px;
    color: var(--pos-text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .pos-redesign .pos-total-amount {
    font-size: var(--pos-total-font, 24px);
    font-weight: 700;
    color: var(--pos-text);
    font-variant-numeric: tabular-nums;
  }
  .pos-redesign .pos-total-amount.pos-green { color: var(--pos-success); }

  /* ── Pay button: слева, крупная, зелёная ── */
  .pos-redesign .pos-pay-btn-main {
    height: 52px;
    min-width: 200px;
    padding: 0 28px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 12px;
    border: none;
    background: var(--pos-success);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.12s;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(5, 150, 105, 0.3);
    order: -10;
  }
  .pos-redesign .pos-pay-btn-main:hover {
    background: #047857;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(5, 150, 105, 0.4);
  }
  .pos-redesign .pos-pay-btn-main:active {
    transform: translateY(0);
    box-shadow: 0 1px 4px rgba(5, 150, 105, 0.25);
  }

  /* ── Secondary actions: компактные кнопки ── */

  .pos-redesign .pos-btm-btn {
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg);
    color: var(--pos-text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
  }
  .pos-redesign .pos-btm-btn:hover {
    border-color: var(--pos-accent);
    color: var(--pos-accent);
    background: #EFF6FF;
  }
  .pos-redesign .pos-btm-btn:active { transform: scale(0.97); }
  .pos-redesign .pos-btn-del { border-color: #FCA5A5; color: var(--pos-danger); }
  .pos-redesign .pos-btn-del:hover { background: #FEF2F2; border-color: var(--pos-danger); color: var(--pos-danger); }
  .pos-redesign .pos-btn-univ { border-color: #FCD34D; color: #D97706; }
  .pos-redesign .pos-btn-univ:hover { background: #FFFBEB; border-color: #D97706; color: #D97706; }

  /* ── Selection counter ── */
  .pos-redesign .pos-sel-count {
    display: none;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--pos-accent);
    background: #EFF6FF;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    margin-right: 8px;
    order: -5;
  }
  .pos-redesign .pos-sel-count.show { display: inline-flex; }

  /* ── Bulk buttons in bottom bar ── */
  .pos-redesign .pos-bulk-inline {
    display: none;
    align-items: center;
    gap: 4px;
  }
  .pos-redesign .pos-bulk-inline.show { display: inline-flex; }
  .pos-redesign .pos-bulk-inline .pos-btm-btn { height: 32px; font-size: 12px; padding: 0 10px; }
  .pos-redesign .pos-bulk-inline .pos-btm-btn.pos-bulk-del-inline { border-color: #FCA5A5; color: var(--pos-danger); }
  .pos-redesign .pos-bulk-inline .pos-btm-btn.pos-bulk-del-inline:hover { background: #FEF2F2; border-color: var(--pos-danger); }

  /* ── Table ── */
  .pos-redesign .pos-scroll-table {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
  }
  .pos-redesign .pos-scroll-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--pos-td-font, 14px);
  }
  .pos-redesign .pos-scroll-table thead { position: sticky; top: 0; z-index: 2; }
  .pos-redesign .pos-scroll-table th {
    padding: 10px 12px;
    text-align: left;
    font-size: var(--pos-th-font, 11px);
    font-weight: 600;
    color: var(--pos-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    background: var(--pos-bg-hover);
    border-bottom: 1px solid var(--pos-border);
    white-space: nowrap;
  }
  .pos-redesign .pos-scroll-table th:first-child { width: 36px; text-align: center; }
  .pos-redesign .pos-scroll-table th:nth-child(3),
  .pos-redesign .pos-scroll-table th:nth-child(6) { text-align: right; }
  .pos-redesign .pos-scroll-table th:nth-child(4) { text-align: center; }
  .pos-redesign .pos-scroll-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--pos-border-light);
    color: var(--pos-text-secondary);
    vertical-align: middle;
    font-size: var(--pos-td-font, 14px);
  }
  .pos-redesign .pos-scroll-table td:first-child { text-align: center; }
  .pos-redesign .pos-scroll-table td:nth-child(3),
  .pos-redesign .pos-scroll-table td:nth-child(6) { text-align: right; font-weight: 600; color: var(--pos-text); font-variant-numeric: tabular-nums; }
  .pos-redesign .pos-scroll-table td:nth-child(4) { text-align: center; }
  .pos-redesign .pos-scroll-table tr {
    transition: background 0.12s;
  }
  .pos-redesign .pos-scroll-table tr.selected td {
    background: #EFF6FF;
  }
  .pos-redesign .pos-scroll-table tr:hover td {
    background: var(--pos-bg-subtle);
  }

  /* ── Row: name + code ── */
  .pos-redesign .pos-cart-row-name { font-weight: 500; color: var(--pos-text); }
  .pos-redesign .pos-cart-row-code { font-size: 11px; color: var(--pos-text-muted); margin-top: 2px; }

  /* ── Qty buttons ── */
  .pos-redesign .pos-cart-row-qty {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .pos-redesign .pos-cart-row-qty button {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg);
    color: var(--pos-text-secondary);
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .pos-redesign .pos-cart-row-qty button:hover { background: var(--pos-bg-hover); border-color: #D1D5DB; }
  .pos-redesign .pos-cart-row-qty span {
    min-width: 24px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
    color: var(--pos-text);
    font-variant-numeric: tabular-nums;
  }

  /* ── Discount display in table ── */
  .pos-redesign .pos-discount-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--pos-danger);
    background: #FEF2F2;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .pos-redesign .pos-old-price {
    font-size: 12px;
    color: var(--pos-text-muted);
    text-decoration: line-through;
    margin-right: 4px;
  }
  .pos-redesign td:nth-child(3) .pos-old-price {
    display: block;
  }

  /* ── Table toolbar (compact) ── */
  .pos-redesign .pos-table-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--pos-border-light);
    background: var(--pos-bg-subtle);
    flex-shrink: 0;
    min-height: 36px;
  }
  .pos-redesign .pos-table-toolbar .pos-tb-count {
    font-size: 12px;
    color: var(--pos-text-muted);
    margin-right: auto;
  }
  .pos-redesign .pos-tb-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg);
    color: var(--pos-text-muted);
    cursor: pointer;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
  }
  .pos-redesign .pos-tb-btn:hover {
    border-color: #D1D5DB;
    background: var(--pos-bg-hover);
    color: var(--pos-text);
  }

  /* ── Right panel transitions ── */
  .pos-redesign .pos-panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(16px);
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease;
    background: var(--pos-bg-subtle);
    border-radius: inherit;
  }
  .pos-redesign .pos-panel.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
    visibility: visible;
  }

  /* ── Quick products grid ── */
  .pos-redesign #pos-fav-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 8px;
  }
  .pos-redesign .pos-quick-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    background: var(--pos-bg);
    border: 1px solid var(--pos-border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    gap: 4px;
    aspect-ratio: 1 / 1;
  }
  .pos-redesign .pos-quick-item:hover {
    border-color: var(--pos-accent);
    background: #EFF6FF;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
  }
  .pos-redesign .pos-quick-item:active { transform: scale(0.97); }
  .pos-redesign .pos-quick-item .qp-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--pos-text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.2;
  }
  .pos-redesign .pos-quick-item .qp-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--pos-accent);
  }

  /* ── Category pills in side panel ── */
  .pos-redesign .pos-cat-pill {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg);
    color: var(--pos-text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
  }
  .pos-redesign .pos-cat-pill:hover {
    border-color: var(--pos-accent);
    color: var(--pos-accent);
    background: #EFF6FF;
  }
  .pos-redesign .pos-cat-pill.active {
    background: var(--pos-accent);
    color: #fff;
    border-color: var(--pos-accent);
  }

  /* ── Top bar ── */
  .pos-redesign .pos-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
    padding: 0 16px;
    background: var(--pos-bg);
    border-bottom: 1px solid var(--pos-border);
    flex-shrink: 0;
  }
  .pos-redesign .pos-top-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--pos-text-secondary);
  }
  .pos-redesign .pos-top-left .pos-clock { font-weight: 600; color: var(--pos-text); font-size: 14px; }
  .pos-redesign .pos-top-left .pos-cashier-name { font-weight: 600; color: var(--pos-text); }
  .pos-redesign .pos-top-tabs {
    display: flex;
    gap: 2px;
    background: var(--pos-bg-hover);
    border-radius: 8px;
    padding: 3px;
  }
  .pos-redesign .pos-top-tab {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--pos-text-muted);
    cursor: pointer;
    background: transparent;
    transition: all 0.12s;
  }
  .pos-redesign .pos-top-tab:hover { color: var(--pos-text); }
  .pos-redesign .pos-top-tab.active {
    background: var(--pos-bg);
    color: var(--pos-text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  /* ── Search strip ── */
  .pos-redesign .pos-search-strip {
    padding: 8px 16px 4px;
    background: var(--pos-bg);
    flex-shrink: 0;
    position: relative;
  }
  .pos-redesign .pos-search-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--pos-bg-hover);
    border: 1.5px solid var(--pos-border);
    border-radius: 10px;
    padding: 2px 2px 2px 14px;
    transition: border-color 0.15s;
  }
  .pos-redesign .pos-search-row:focus-within {
    border-color: var(--pos-accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
  }
  .pos-redesign .pos-search-row input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--pos-text);
    padding: 8px 0;
  }
  .pos-redesign .pos-search-row input::placeholder { color: var(--pos-text-placeholder); }

  /* ── Customer row ── */
  .pos-redesign .pos-customer-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: var(--pos-bg);
    border-bottom: 1px solid var(--pos-border);
    flex-shrink: 0;
    font-size: 13px;
  }
  .pos-redesign .pos-customer-row input {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg-subtle);
    font-size: 13px;
    color: var(--pos-text);
    width: 150px;
  }
  .pos-redesign .pos-customer-row button {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--pos-border);
    background: var(--pos-bg);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--pos-text-secondary);
    transition: all 0.12s;
  }
  .pos-redesign .pos-customer-row button:hover { background: var(--pos-bg-hover); }

  /* ── Main grid ── */
  .pos-redesign .pos-main-grid {
    flex: 1;
    display: flex;
    overflow: hidden;
    padding: 6px 16px 8px;
    gap: 10px;
    min-height: 0;
  }
  .pos-redesign .pos-table-col {
    flex: 7;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--pos-bg);
    border-radius: 10px;
    border: 1px solid var(--pos-border);
    min-height: 0;
  }
  .pos-redesign .pos-side-col {
    flex: 3;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--pos-bg);
    border-radius: 10px;
    border: 1px solid var(--pos-border);
    min-height: 0;
  }
  .pos-redesign .pos-side-header {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--pos-text-secondary);
    border-bottom: 1px solid var(--pos-border);
    background: var(--pos-bg-hover);
    flex-shrink: 0;
  }
  .pos-redesign .pos-side-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
    min-height: 0;
  }
  .pos-redesign .pos-side-sale {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--pos-border-light);
  }
  .pos-redesign .pos-side-sale:hover { background: var(--pos-bg-hover); }
  .pos-redesign .pos-side-sale-num { font-size: 12px; font-weight: 600; color: var(--pos-accent); min-width: 50px; }
  .pos-redesign .pos-side-sale-info { flex: 1; font-size: 12px; color: var(--pos-text-secondary); min-width: 0; }
  .pos-redesign .pos-side-sale-info .side-sale-time { font-size: 11px; color: var(--pos-text-muted); display: block; }
  .pos-redesign .pos-side-sale-amount { font-size: 13px; font-weight: 700; color: var(--pos-text); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── Main grid responsive ── */
  @media (max-width: 1100px) {
    .pos-redesign .pos-main-grid { flex-direction: column; }
    .pos-redesign .pos-table-col { flex: none; width: 100%; }
    .pos-redesign .pos-side-col { flex: none; width: 100%; }
    .pos-redesign .pos-bottom-bar { flex-wrap: wrap; }
    .pos-redesign .pos-bottom-left { margin-right: 0; }
  }

  /* ── 1024×768 optimization ── */
  @media (min-width: 1020px) and (max-width: 1030px), (min-height: 760px) and (max-height: 780px) {
    .pos-redesign {
      --pos-mx: 0;
      --pos-my: 0;
      --pos-top-h: 44px;
      --pos-tab-pad: 5px 14px;
      --pos-tab-font: 12px;
      --pos-search-pad: 6px 12px 2px;
      --pos-customer-pad: 4px 12px;
      --pos-grid-pad: 4px 12px 6px;
      --pos-th-pad: 8px 10px;
      --pos-th-font: 10px;
      --pos-td-pad: 8px 10px;
      --pos-td-font: 13px;
      --pos-bottom-pad: 8px 12px;
      --pos-total-font: 20px;
      --pos-btn-h: 36px;
    }
    .pos-redesign .pos-pay-btn-main { height: 44px; min-width: 160px; font-size: 16px; }
    .pos-redesign .pos-quick-item { padding: 10px 6px; }
    .pos-redesign .pos-quick-item .qp-name { font-size: 12px; }
    .pos-redesign .pos-quick-item .qp-price { font-size: 14px; }
  }

  /* ── Empty state ── */
  .pos-redesign .pos-empty-msg {
    padding: 32px 16px;
    text-align: center;
    color: var(--pos-text-muted);
    font-size: 14px;
  }

  /* ── Side sale badge ── */
  .pos-redesign .side-pay-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ============================================
     ГЛОБАЛЬНЫЙ UI CLEANUP — все страницы
     Убираем визуальный шум, не ломая логику
     ============================================ */

  /* ── Единая дизайн-система: compact mode ── */
  :root {
    --global-btn-sm: 30px;
    --global-gap-sm: 6px;
    --global-radius: 8px;
  }

  /* ── Уменьшаем page-header на всех страницах ── */
  .page-header { margin-bottom: 16px !important; }
  .page-header h1 { font-size: 20px !important; }
  .page-header p { font-size: 13px !important; margin-top: 2px; }

  /* ── Убираем дублирующиеся заголовки в панелях ── */
  .panel-title { font-size: 14px !important; }
  .panel-title .btn { font-size: 12px; padding: 4px 10px; height: 28px; }

  /* ── ДАШБОРД: компактные карточки, скролл панелей ── */
  #page-dashboard .cards { gap: 10px; }
  #page-dashboard .cards .card { padding: 14px 16px; }
  #page-dashboard .dash-analytics-grid { gap: 12px !important; margin-bottom: 12px !important; }
  #page-dashboard .panel { margin-bottom: 12px !important; }
  #page-dashboard .panel:not(#panel-sales-today) { max-height: 280px; overflow-y: auto; }
  #page-dashboard #panel-dash-lowstock { max-height: none; }
  #page-dashboard .panel-title .collapse-btn { font-size: 10px; padding: 2px 6px; }

  /* ── ТОВАРЫ: компактные кнопки и фильтры ── */
  #page-products .products-action-bar { gap: 4px; padding: 4px 0; }
  #page-products .products-action-bar .action-btn {
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    gap: 4px;
    border-radius: 6px;
  }
  #page-products .products-action-bar .action-btn .act-icon { font-size: 13px; }
  #page-products .products-action-bar .action-btn.primary { height: 30px; padding: 0 14px; font-size: 13px; }
  /* Компактные фильтры */
  #page-products .product-filters { gap: 6px; }
  #page-products .product-filters select,
  #page-products .product-filters input[type="number"],
  #page-products .product-filters input[type="text"],
  #page-products .product-filters input[type="date"] {
    height: 28px;
    padding: 2px 8px;
    font-size: 12px;
    border-radius: 6px;
  }
  #page-products .product-filters .search-box { max-width: 220px !important; min-width: 120px !important; }
  #page-products .product-filters .search-box input { font-size: 12px; }
  #page-products .product-filters label { font-size: 12px; gap: 4px; }
  #page-products .product-filters input[type="checkbox"] { width: 14px; height: 14px; }
  #page-products #filter-sku { width: 80px !important; }
  #page-products #filter-supplier { min-width: 120px !important; }
  /* Компактный bulk-bar (не скрываем, только уменьшаем) */
  #page-products #bulk-bar { padding: 4px 10px !important; gap: 4px !important; }
  #page-products #bulk-bar .btn { height: 26px; font-size: 11px; padding: 2px 8px; }
  #page-products #bulk-bar span { font-size: 12px; }

  /* ── СТАТИСТИКА: компактные вкладки, меньше отступов ── */
  #page-statistics .tabs { gap: 4px; margin-bottom: 10px !important; }
  #page-statistics .tabs .tab {
    height: 28px;
    padding: 4px 14px;
    font-size: 12px;
    border-radius: 6px;
  }
  #page-statistics .panel { margin-bottom: 10px !important; }
  #page-statistics .panel-title { font-size: 13px !important; padding: 6px 0; }
  #page-statistics .panel-title .btn { height: 26px; font-size: 11px; padding: 2px 8px; }
  #page-statistics .sales-grid { gap: 10px !important; margin-bottom: 10px !important; }
  #page-statistics .panel .panel-title { display: flex; align-items: center; gap: 6px; }

  /* ── РАСХОДЫ: компактно ── */
  #page-expenses .page-header > div:last-child { gap: 4px; }
  #page-expenses .btn { height: 30px; font-size: 12px; padding: 0 12px; }

  /* ── СКИДОЧНЫЕ КАРТЫ: компактные кнопки ── */
  #page-cards .toolbar { gap: 6px; margin-bottom: 12px; }
  #page-cards .toolbar .btn { height: 28px; font-size: 12px; padding: 0 10px; }

  /* ── ДОЛГИ ── */
  #page-debts .messenger-sidebar { max-height: 480px; overflow-y: auto; }
  #page-debts .messenger-content { min-height: 400px; }

  /* ── ДОКУМЕНТЫ: компактно ── */
  #page-documents .page-header > div:last-child { gap: 4px; }
  #page-documents .btn { height: 30px; font-size: 12px; padding: 0 12px; }

  /* ── ВСЕ ТАБЛИЦЫ: единые отступы ── */
  .table-wrap table th,
  .table-wrap table td {
    padding: 8px 12px !important;
    font-size: 13px;
  }
  .table-wrap table th { font-size: 11px !important; }

  /* ── ВСЕ БЛОКИ: убираем лишние inline-style max-width на кнопках ── */
  .btn, .action-btn { white-space: nowrap; }

  /* ── Анимации появления панелей ── */
  .page:not(.active) { display: none; }
  .page.active { animation: fadeIn 0.15s ease; }
  @keyframes fadeIn {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }

</head>

<!-- SUPABASE AUTH -->

      Нужен сайт в интернете: один раз выложите папку на <strong>GitHub Pages</strong> или <strong>Netlify</strong>.<br>
      Инструкция: файл <code>docs/КАК_ВЫЛОЖИТЬ_САЙТ.md</code> или <code>ОТКРЫТЬ_САЙТ.txt</code> на рабочем столе в папке 095.<br>
      <span style="color:var(--text-muted)">Для проверки на ПК: <a href="http://127.0.0.1:5500" style="color:#dc2626">http://127.0.0.1:5500</a> (сначала запустите python -m http.server 5500)</span>
    </div>

    <div id="auth-login" class="auth-panel" style="display:block">

          <input type="email" id="auth-email" autocomplete="username" required placeholder="admin@example.com">

        <div class="field">
          <label>Пароль</label>
          <input type="password" id="auth-password" autocomplete="current-password" required>

        Нет аккаунта? <button type="button" class="btn btn-secondary btn-sm" id="btn-show-register">Регистрация</button>
      </p>
      <p class="login-hint" style="margin-top:12px;font-size:12px">
        Зарегистрируйтесь и введите мастер-код администратора при создании магазина.<br>
        Кассиров добавляет администратор: «Кассиры» → «+ Новый кассир».
      </p>
    </div>

    <div id="auth-register" class="auth-panel">
      <form id="auth-register-form">
        <div class="field" id="reg-invite-code-wrap" style="display:none">

        </div>
        <div class="field">
          <label>Имя</label>
          <input type="text" id="reg-name" required placeholder="Иван Админов">
        </div>
        <div class="field">
          <label>Логин (электронная почта)</label>
          <input type="email" id="reg-email" required placeholder="admin@example.com">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" id="reg-password" required minlength="6">
        </div>
        <div class="field">
          <label>Повторите пароль</label>
          <input type="password" id="reg-password2" required minlength="6">
        </div>
        <div class="field" id="reg-master-code-wrap">
          <label>Мастер-код администратора (для создания магазина)</label>
          <input type="password" id="reg-master-code" placeholder="Введите если есть, иначе пропустите" autocomplete="off">

        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Зарегистрироваться</button>
      </form>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted)">
        <button type="button" class="btn btn-secondary btn-sm" id="btn-show-login">← К входу</button>
      </p>
    </div>

    <div id="auth-stores" class="auth-panel">
      <p style="font-size:14px;color:var(--muted);margin-bottom:12px">Выберите магазин для работы:</p>
      <div id="store-list"></div>
      <button type="button" class="btn btn-primary" style="width:100%;margin-top:12px" id="btn-goto-create-store">➕ Создать магазин</button>
      <button type="button" class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px" id="btn-auth-logout">Выйти из аккаунта</button>
    </div>

    <div id="auth-create-store" class="auth-panel">
      <form id="auth-create-store-form">
        <div class="field">
          <label>Название магазина</label>
          <input type="text" id="new-store-name-auth" required placeholder="Основной магазин">
        </div>
        <div class="field">
          <label>Мастер-код администратора *</label>
          <input type="password" id="create-store-master-code" required placeholder="Введите мастер-код" autocomplete="off">
          <p style="font-size:11px;color:var(--text-muted);margin-top:4px">Для создания магазина нужен секретный мастер-код.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Создать</button>
      </form>
      <button type="button" class="btn btn-secondary btn-sm" style="width:100%;margin-top:10px" onclick="ApScreens.showScreen('auth-stores')">← Назад</button>
    </div>
  </div>
</div>

<!-- ЧЕК / КОРЗИНА (просмотр) -->

</div>

      <button class="btn btn-danger" onclick="if(confirm('Очистить кэш?')){DataService.diagnostics.clearAllCaches();toast('Кэш очищен','ok');runDiagnostics();}">🗑️ Очистить кэш</button>
      <button class="btn btn-primary" onclick="closeModal('modal-diagnostics')">Закрыть</button>
    </div>
  </div>
</div>

      <button class="btn btn-primary" onclick="closeModal('modal-error-log')">Закрыть</button>
    </div>
  </div>
</div>
